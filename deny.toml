# cargo-deny — license compliance + advisory metadata (see scripts/check-dependencies.sh).
# CVE severity gate (critical/high only) is enforced by cargo-audit in the same script.
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "none"
unsound = "workspace"
ignore = [
    { id = "RUSTSEC-2026-0118", reason = "libp2p-dns → hickory-proto 0.25.2; tracked in docs/DEPENDENCY_RISK.md until libp2p upgrade (review 2026-09-30)" },
    { id = "RUSTSEC-2026-0119", reason = "libp2p-dns → hickory-proto 0.25.2; tracked in docs/DEPENDENCY_RISK.md until libp2p upgrade (review 2026-09-30)" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via uniffi/plist; no untrusted XML surface — review 2026-09-30" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via uniffi/plist; no untrusted XML surface — review 2026-09-30" },
    { id = "RUSTSEC-2026-0185", reason = "quinn-proto via libp2p-quic; libp2p-authenticated peers only — review 2026-09-30" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "OpenSSL",
    "Unlicense",
    "AGPL-3.0-or-later",
    "CDLA-Permissive-2.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
