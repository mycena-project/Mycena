name: Mycena
options:
  bundleIdPrefix: io.github.mycena_project
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MYCENA_RUST_FFI
targets:
  Mycena:
    type: application
    platform: iOS
    sources:
      - path: Mycena
        excludes:
          - Resources/Info.ble.plist.snippet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mycena_project.app
        INFOPLIST_KEY_CFBundleDisplayName: Mycena
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: >-
          Mycena uses Bluetooth for offline mesh messaging with nearby devices.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: >-
          Mycena discovers nearby mesh peers on your local Wi‑Fi network.
        INFOPLIST_KEY_UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        OTHER_LDFLAGS: >-
          $(inherited) -framework CoreBluetooth -framework Security
          -framework SystemConfiguration -lc++ -lz
    dependencies:
      - framework: rust-build/MycenaFFI.xcframework
        embed: false
