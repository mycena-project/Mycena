# Minimal Android toolchain image (no sources baked in).
#
#   docker compose --profile android build android-ci
#   ./scripts/docker-android-build.sh
#
# APK is written to android/app/build/outputs/... on the host (bind mount).
#
# Rust-only tests + clippy (no Android SDK on host):
#
#   docker compose --profile rust run --rm rust-tests
#
# The rust-tests image build uses a tiny context (docker/rust-tests/ only) so
# `docker compose build rust-tests` does not upload the whole workspace; sources
# are bind-mounted at run time. The Dockerfile uses `rust:*-slim-bookworm` (not
# the full bookworm image) to keep the base layer download small.
#
# See also: docs/AGENT_CONTINUATION.md

services:
  rust-tests:
    profiles: ["rust"]
    build:
      context: docker/rust-tests
      dockerfile: Dockerfile
    image: mycelium-rust-tests:local
    working_dir: /workspace
    volumes:
      - .:/workspace
      - mycelium-cargo-registry:/usr/local/cargo/registry
      - mycelium-cargo-git:/usr/local/cargo/git
      - mycelium-target-docker:/workspace/target-docker
    environment:
      CARGO_TARGET_DIR: /workspace/target-docker
    command:
      [
        "sh",
        "-c",
        "cargo test --workspace && cargo clippy --workspace --all-targets -- -D warnings",
      ]

  android-ci:
    profiles: ["android"]
    build:
      context: docker/android-ci
      dockerfile: Dockerfile
    image: mycelium-android-ci:local

volumes:
  mycelium-cargo-registry:
  mycelium-cargo-git:
  mycelium-target-docker:
