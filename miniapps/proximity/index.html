<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, sans-serif;
      background: #f8f7f4; color: #1a1a18;
      min-height: 100vh;
    }
    .header {
      padding: 16px; background: white;
      border-bottom: 0.5px solid rgba(0,0,0,0.08);
      display: flex; align-items: center; justify-content: space-between;
    }
    .header h1 { font-size: 20px; font-weight: 500; }
    .badge {
      font-size: 12px; padding: 3px 10px; border-radius: 12px;
      background: #E1F5EE; color: #0F6E56;
    }
    .tabs {
      display: flex; background: white;
      border-bottom: 0.5px solid rgba(0,0,0,0.08);
    }
    .tab {
      flex: 1; padding: 12px; text-align: center; font-size: 14px;
      border: none; background: none; cursor: pointer; color: #5F5E5A;
    }
    .tab.active { color: #0F6E56; font-weight: 500; border-bottom: 2px solid #1D9E75; }
    .setup {
      padding: 32px 20px; display: flex; flex-direction: column;
      gap: 16px; max-width: 400px; margin: 0 auto;
    }
    .setup h2 { font-size: 18px; font-weight: 500; }
    .setup p { font-size: 14px; color: #5F5E5A; line-height: 1.5; }
    .field label {
      display: block; font-size: 13px;
      color: #5F5E5A; margin-bottom: 4px;
    }
    .field input, .field textarea, .field select {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 0.5px solid rgba(0,0,0,0.12);
      font-size: 14px; font-family: inherit; background: white;
    }
    .field textarea { resize: vertical; min-height: 72px; }
    .photo-preview {
      width: 72px; height: 72px; border-radius: 50%; margin-top: 8px;
      background: #E1F5EE; display: none; align-items: center;
      justify-content: center; overflow: hidden;
    }
    .photo-preview.visible { display: flex; }
    .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .tag {
      padding: 4px 10px; border-radius: 12px;
      background: #e8f4ff; color: #1a5fa8;
      font-size: 13px; cursor: pointer;
    }
    .tag.selected { background: #1D9E75; color: white; }
    .btn {
      padding: 12px; background: #1D9E75; color: white;
      border: none; border-radius: 10px; font-size: 15px;
      cursor: pointer; width: 100%;
    }
    .btn.secondary {
      background: white; color: #1a1a18;
      border: 0.5px solid rgba(0,0,0,0.12);
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .profiles { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .profile-card {
      background: white; border-radius: 12px; padding: 16px;
      border: 0.5px solid rgba(0,0,0,0.08);
    }
    .profile-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
    }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: #E1F5EE; display: flex; align-items: center;
      justify-content: center; font-size: 20px; flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { font-weight: 500; font-size: 16px; }
    .meta { font-size: 13px; color: #5F5E5A; }
    .bio { font-size: 14px; color: #333; margin: 6px 0; line-height: 1.4; }
    .interests { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
    .interest {
      font-size: 12px; padding: 2px 8px; border-radius: 10px;
      background: #f0f0ee; color: #555;
    }
    .match-status {
      font-size: 12px; color: #0F6E56; margin: 6px 0;
    }
    .match-status.pending { color: #92400e; }
    .action-btn {
      margin-top: 10px; padding: 8px 16px; background: #1D9E75;
      color: white; border: none; border-radius: 8px;
      font-size: 14px; cursor: pointer; width: 100%;
    }
    .action-btn.secondary {
      background: white; color: #1a1a18;
      border: 0.5px solid rgba(0,0,0,0.12);
    }
    .empty {
      text-align: center; padding: 48px 20px; color: #888;
    }
    .warning {
      background: #fff8e1; border: 0.5px solid #f59e0b;
      border-radius: 8px; padding: 12px; font-size: 13px;
      color: #92400e; line-height: 1.5;
    }
    .active-banner {
      background: #E1F5EE; padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .active-banner span { font-size: 13px; color: #0F6E56; }
    .stop-btn {
      font-size: 12px; padding: 4px 10px; background: white;
      color: #dc2626; border: 0.5px solid #dc2626;
      border-radius: 6px; cursor: pointer;
    }
    .messages { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .thread-card {
      background: white; border-radius: 12px; padding: 14px;
      border: 0.5px solid rgba(0,0,0,0.08); cursor: pointer;
    }
    .thread-card.unread { border-color: #1D9E75; }
    .thread-preview { font-size: 13px; color: #666; margin-top: 4px; }
    .chat-panel {
      display: none; flex-direction: column; height: calc(100vh - 120px);
    }
    .chat-panel.open { display: flex; }
    .chat-header {
      padding: 12px 16px; background: white;
      border-bottom: 0.5px solid rgba(0,0,0,0.08);
      display: flex; align-items: center; gap: 10px;
    }
    .chat-back {
      border: none; background: none; font-size: 18px; cursor: pointer;
    }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .bubble {
      max-width: 80%; padding: 10px 12px; border-radius: 14px;
      font-size: 14px; line-height: 1.4;
    }
    .bubble.them { align-self: flex-start; background: white; }
    .bubble.me { align-self: flex-end; background: #1D9E75; color: white; }
    .chat-input-row {
      display: flex; gap: 8px; padding: 12px; background: white;
      border-top: 0.5px solid rgba(0,0,0,0.08);
    }
    .chat-input-row input {
      flex: 1; padding: 10px 12px; border-radius: 20px;
      border: 0.5px solid rgba(0,0,0,0.12); font-size: 14px;
    }
    .chat-input-row button {
      padding: 10px 16px; border: none; border-radius: 20px;
      background: #1D9E75; color: white; cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="header">
  <h1>🌿 Nearby</h1>
  <span class="badge" id="count-badge">0 nearby</span>
</div>

<div id="app"></div>

<script src="app.js"></script>

</body>
</html>
