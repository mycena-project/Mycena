<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeshMarket</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #f8f7f4; color: #1a1a18; min-height: 100vh; padding-bottom: 80px; }
    .header { padding: 14px 16px; background: white; border-bottom: 0.5px solid rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 18px; font-weight: 600; }
    .cats { display: flex; overflow-x: auto; gap: 6px; padding: 10px 12px; background: white; border-bottom: 0.5px solid rgba(0,0,0,0.06); }
    .cat { padding: 6px 12px; border-radius: 16px; font-size: 13px; border: none; cursor: pointer; background: #f0f0ee; color: #444; white-space: nowrap; }
    .cat.active { background: #2563eb; color: white; }
    .listings { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: white; border-radius: 12px; overflow: hidden; border: 0.5px solid rgba(0,0,0,0.08); }
    .card-img { width: 100%; height: 140px; object-fit: cover; background: #eee; display: block; }
    .card-body { padding: 12px; }
    .price { font-weight: 600; color: #2563eb; font-size: 15px; margin: 4px 0; }
    .meta { font-size: 12px; color: #888; }
    .desc { font-size: 13px; color: #444; margin-top: 6px; line-height: 1.4; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn { flex: 1; padding: 8px; border-radius: 8px; font-size: 13px; cursor: pointer; border: 0.5px solid rgba(0,0,0,0.12); background: white; }
    .btn.primary { background: #2563eb; color: white; border-color: #2563eb; }
    .fab { position: fixed; bottom: 20px; right: 20px; width: 52px; height: 52px; border-radius: 50%; background: #2563eb; color: white; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: flex-end; z-index: 10; }
    .modal-bg.open { display: flex; }
    .modal { background: white; border-radius: 16px 16px 0 0; padding: 20px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
    .field input, .field textarea, .field select { width: 100%; padding: 9px 11px; border-radius: 8px; border: 0.5px solid rgba(0,0,0,0.15); font-size: 14px; font-family: inherit; }
    .field textarea { min-height: 72px; resize: vertical; }
    .submit { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; margin-top: 8px; }
    .empty { text-align: center; padding: 48px 20px; color: #888; }
    .trade-badge { display: inline-block; background: #E1F5EE; color: #0F6E56; font-size: 11px; padding: 2px 8px; border-radius: 8px; margin-left: 6px; }
  </style>
</head>
<body>
<div class="header">
  <h1>🛒 MeshMarket</h1>
  <span id="count" style="font-size:13px;color:#888">0 listings</span>
</div>
<div class="cats" id="cats"></div>
<div class="listings" id="listings"></div>
<button class="fab" id="fab">+</button>
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 style="margin-bottom:16px;font-size:18px">New listing</h2>
    <div class="field"><label>Title</label><input id="f-title" maxlength="80" placeholder="What are you offering?"></div>
    <div class="field"><label>Description</label><textarea id="f-desc" maxlength="400" placeholder="Condition, pickup details…"></textarea></div>
    <div class="field"><label>Price type</label>
      <select id="f-price-type"><option value="mxc">MXC (Muon)</option><option value="trade">Trade / barter</option></select>
    </div>
    <div class="field" id="price-field"><label>Price (muon)</label><input id="f-price" type="number" min="0" placeholder="0"></div>
    <div class="field" id="pay-addr-field"><label>Your MXC address (for buyers)</label><input id="f-pay-addr" placeholder="mxc1…"></div>
    <div class="field"><label>Contact peer ID (optional)</label><input id="f-peer" placeholder="Leave blank to use your peer ID"></div>
    <div class="field"><label>Photo (optional, max 50KB)</label><input type="file" id="f-photo" accept="image/png,image/jpeg"></div>
    <div class="field"><label>Expires</label>
      <select id="f-ttl"><option value="86400">24 hours</option><option value="259200">3 days</option><option value="604800">7 days</option></select>
    </div>
    <button class="submit" id="submit">Publish listing</button>
    <button style="width:100%;padding:12px;background:none;border:none;color:#888;margin-top:8px;cursor:pointer" id="cancel">Cancel</button>
  </div>
</div>
<script>
  const CATEGORIES = [
    { id: 'food', label: '🍎 Food' },
    { id: 'tools', label: '🔧 Tools' },
    { id: 'shelter', label: '🏠 Shelter' },
    { id: 'clothing', label: '👕 Clothing' },
    { id: 'medical', label: '💊 Medical' },
    { id: 'services', label: '🤝 Services' },
    { id: 'other', label: '📦 Other' },
  ];
  const STORAGE_KEY = 'meshmarket_listings';
  let category = 'food';
  let listings = [];
  let myPeerId = '';

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function scopeFor(cat) { return `market/${cat}`; }

  async function init() {
    try {
      const id = await window.mycelium?.getIdentity?.();
      myPeerId = id?.peer_id || '';
    } catch {}
    renderCats();
    await loadListings();
  }

  function renderCats() {
    document.getElementById('cats').innerHTML = CATEGORIES.map(c =>
      `<button class="cat ${c.id===category?'active':''}" data-cat="${c.id}">${c.label}</button>`
    ).join('');
    document.querySelectorAll('.cat').forEach(btn => btn.addEventListener('click', () => {
      category = btn.dataset.cat; renderCats(); loadListings();
    }));
  }

  async function loadListings() {
    const scope = scopeFor(category);
    try {
      const stored = await window.mycelium?.storage.get(STORAGE_KEY + ':' + category);
      listings = stored ? JSON.parse(stored).filter(l => l.expires_at > Date.now()) : [];
      const bulletins = await window.mycelium?.getBulletins(scope) || [];
      bulletins.forEach(b => {
        try {
          const l = JSON.parse(b.body);
          if (l.meshmarket && l.category === category && !listings.find(x => x.id === l.id)) {
            listings.push({ ...l, seller_name: b.from_display_name, expires_at: b.expires_at_ms });
          }
        } catch {}
      });
      listings.sort((a,b) => b.created_at - a.created_at);
      await window.mycelium?.storage.set(STORAGE_KEY + ':' + category, JSON.stringify(listings));
    } catch (e) { console.error(e); }
    renderListings();
  }

  function renderListings() {
    document.getElementById('count').textContent = `${listings.length} listings`;
    const el = document.getElementById('listings');
    if (!listings.length) {
      el.innerHTML = `<div class="empty"><p style="font-size:36px">🛒</p><p>No listings in this category yet.</p></div>`;
      return;
    }
    el.innerHTML = listings.map(l => {
      const priceLabel = l.price_type === 'trade'
        ? 'Trade / barter<span class="trade-badge">swap</span>'
        : `${l.price_muon || 0} μMXC`;
      return `<div class="card">
        ${l.photo_base64 ? `<img class="card-img" src="data:image/png;base64,${l.photo_base64}">` : ''}
        <div class="card-body">
          <div style="font-weight:500;font-size:15px">${esc(l.title)}</div>
          <div class="price">${priceLabel}</div>
          <div class="meta">${esc(l.seller_name || 'Seller')} · ${new Date(l.created_at).toLocaleDateString()}</div>
          ${l.description ? `<div class="desc">${esc(l.description)}</div>` : ''}
          <div class="actions">
            <button class="btn" data-msg="${l.id}">💬 Contact</button>
            ${l.price_type === 'mxc' && l.price_muon > 0
              ? `<button class="btn primary" data-pay="${l.id}">Pay ${l.price_muon} μ</button>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
    document.querySelectorAll('[data-msg]').forEach(btn => btn.addEventListener('click', () => contactSeller(btn.dataset.msg)));
    document.querySelectorAll('[data-pay]').forEach(btn => btn.addEventListener('click', () => paySeller(btn.dataset.pay)));
  }

  async function contactSeller(listingId) {
    const l = listings.find(x => x.id === listingId);
    if (!l) return;
    const peer = l.seller_peer || prompt('Seller peer ID to message:');
    if (!peer) return;
    const msg = prompt(`Message about "${l.title}":`);
    if (!msg) return;
    try {
      await window.mycelium?.sendMessage(peer, `[MeshMarket] ${msg}`);
      alert('Message sent!');
    } catch (e) { alert('Failed: ' + e.message); }
  }

  async function paySeller(listingId) {
    const l = listings.find(x => x.id === listingId);
    if (!l || !l.price_muon) return;
    if (!l.payment_address) {
      alert('Seller has no payment address on file. Use Contact instead.');
      return;
    }
    try {
      await window.mycelium?.requestPayment(l.price_muon, `MeshMarket: ${l.title}`);
      alert('Payment initiated — confirm in the host app.');
    } catch (e) { alert('Payment failed: ' + e.message); }
  }

  document.getElementById('f-price-type').addEventListener('change', (e) => {
    const isMxc = e.target.value === 'mxc';
    document.getElementById('price-field').style.display = isMxc ? 'block' : 'none';
    document.getElementById('pay-addr-field').style.display = isMxc ? 'block' : 'none';
  });

  document.getElementById('fab').addEventListener('click', () => document.getElementById('modal').classList.add('open'));
  document.getElementById('cancel').addEventListener('click', () => document.getElementById('modal').classList.remove('open'));

  document.getElementById('submit').addEventListener('click', async () => {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { alert('Title required'); return; }
    const priceType = document.getElementById('f-price-type').value;
    const ttl = parseInt(document.getElementById('f-ttl').value, 10);
    let photo_base64 = null;
    const file = document.getElementById('f-photo').files?.[0];
    if (file) {
      if (file.size > 50000) { alert('Photo max 50KB'); return; }
      photo_base64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }
    let payment_address = document.getElementById('f-pay-addr').value.trim() || null;
    const listing = {
      id: crypto.randomUUID(),
      meshmarket: true,
      category,
      title,
      description: document.getElementById('f-desc').value.trim(),
      price_type: priceType,
      price_muon: priceType === 'mxc' ? parseInt(document.getElementById('f-price').value || '0', 10) : 0,
      seller_peer: document.getElementById('f-peer').value.trim() || myPeerId,
      seller_name: 'You',
      payment_address,
      photo_base64,
      created_at: Date.now(),
      expires_at: Date.now() + ttl * 1000,
    };
    listings.unshift(listing);
    await window.mycelium?.storage.set(STORAGE_KEY + ':' + category, JSON.stringify(listings));
    await window.mycelium?.postBulletin(scopeFor(category), listing.title, JSON.stringify(listing), ttl);
    document.getElementById('modal').classList.remove('open');
    document.getElementById('f-title').value = '';
    document.getElementById('f-desc').value = '';
    renderListings();
  });

  init();
  window.mycelium?.registerBulletinRefresh?.(loadListings);
  setInterval(loadListings, 20000);
</script>
</body>
</html>
