name: Android CI

# Heavy job — path-filtered on PRs. Full tier + main pushes always build Android.

on:
  push:
    branches:
      - main
      - master
      - "release/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_TIER: ${{ vars.MYCELIUM_CI_TIER || 'budget' }}

jobs:
  changes:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'crates/mycelium-ffi/**'
              - 'crates/mycelium-android/**'
              - 'crates/mycelium-app/**'
              - 'crates/mycelium-node/**'
              - 'crates/mycelium-core/**'

  android:
    needs: changes
    if: |
      github.actor != 'dependabot[bot]' &&
      (
        needs.changes.outputs.android == 'true' ||
        (vars.MYCELIUM_CI_TIER == 'full' && github.event_name != 'pull_request')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h

      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: "1.88.0"
          cache-key-suffix: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Export NDK for cargo-ndk
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Build Android (Rust + UniFFI + Gradle)
        run: bash android/build.sh

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mycelium-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
