name: Android CI

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "release/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Export NDK for cargo-ndk
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"

      - name: Build Android (Rust + UniFFI + Gradle)
        run: ./android/build.sh

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
