name: Fuzz (nightly)

# Long fuzz runs + corpus growth. Disabled while MYCELIUM_CI_TIER=budget (default).
# Manual workflow_dispatch always available for ad-hoc local-scale runs.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      seconds_per_target:
        description: "Seconds per target (default 14400 = 4h)"
        required: false
        default: "14400"

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

env:
  CI_TIER: ${{ vars.MYCELIUM_CI_TIER || 'budget' }}
  FUZZ_SECONDS: ${{ github.event.inputs.seconds_per_target || '14400' }}

jobs:
  fuzz:
    if: |
      github.event_name == 'workflow_dispatch' ||
      vars.MYCELIUM_CI_TIER == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_envelope
          - fuzz_ble_frame
          - fuzz_ble_stream
          - fuzz_ble_multiaddr
          - fuzz_gossipsub_wire
          - fuzz_sync_bloom
          - fuzz_invite
          - fuzz_coin_payload
          - fuzz_custody_envelope
          - fuzz_miniapp_bundle
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo + fuzz corpus
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
            fuzz/corpus/${{ matrix.target }}
          key: fuzz-nightly-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', 'fuzz/**') }}
          restore-keys: |
            fuzz-nightly-${{ matrix.target }}-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: "Fuzz ${{ matrix.target }} (${{ env.FUZZ_SECONDS }}s)"
        working-directory: fuzz
        run: |
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time=${{ env.FUZZ_SECONDS }} \
            -rss_limit_mb=8192 \
            -timeout=60

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            fuzz/artifacts/**
            fuzz/corpus/**
          if-no-files-found: ignore
