name: MyceliumLab nightly

on:
  workflow_dispatch:

concurrency:
  group: myceliumlab-nightly
  cancel-in-progress: false

env:
  CI_TIER: ${{ vars.MYCELIUM_CI_TIER || 'budget' }}

jobs:
  dense-cluster-10k:
    if: github.event_name == 'workflow_dispatch' || vars.MYCELIUM_CI_TIER == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: "1.88.0"
          cache-key-suffix: myceliumlab-nightly

      - name: Dense cluster 10k smoke
        run: cargo test -p mycelium-sim dense_cluster_10k_smoke -- --ignored --nocapture
