name: MyceliumLab nightly

on:
  schedule:
    # 03:00 UTC — after fuzz nightly
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: myceliumlab-nightly
  cancel-in-progress: false

jobs:
  dense-cluster-10k:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Dense cluster 10k smoke
        run: cargo test -p mycelium-sim dense_cluster_10k_smoke -- --ignored --nocapture
