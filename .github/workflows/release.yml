# Release on tag: Android APK + Tauri desktop bundles + SHA256SUMS.
# License: AGPL-3.0-or-later — see release notes and LICENSE.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  android:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager 'ndk;26.1.10909125'

      - name: Export NDK for cargo-ndk
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: bash android/build.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-2022
            target: windows
          - os: macos-14
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: release-desktop-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: crates/mycelium-desktop/ui
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/mycelium-desktop
          tauriScript: cargo tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            crates/mycelium-desktop/target/release/bundle/**/*.AppImage
            crates/mycelium-desktop/target/release/bundle/**/*.deb
            crates/mycelium-desktop/target/release/bundle/**/*.dmg
            crates/mycelium-desktop/target/release/bundle/**/*.msi
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          STAGING="release-assets"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          if [ -f artifacts/android-apk/app-debug.apk ]; then
            cp artifacts/android-apk/app-debug.apk "$STAGING/mycelium-${TAG}-android-debug.apk"
          fi

          find artifacts -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.msi' \
          \) -exec cp {} "$STAGING/" \;

          if [ -z "$(ls -A "$STAGING" 2>/dev/null)" ]; then
            echo "::error::No release artifacts found."
            exit 1
          fi

          ( cd "$STAGING" && shasum -a 256 ./* > SHA256SUMS.txt )
          ls -la "$STAGING"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## License — AGPL-3.0-or-later

            **Mycelium** is free software under the [GNU Affero General Public License v3.0 or later](https://www.gnu.org/licenses/agpl-3.0.html).

            - If you **modify and operate** Mycelium (app, relay, or combined stack) as a **network service**, you must offer **corresponding source** to users interacting with it over the network.
            - To run your **own bootstrap relay**, see [mycelium-relay](https://github.com/mycena-project/mycelium-relay) (same license).

            ### Artifacts

            | File | Platform |
            |------|----------|
            | `mycelium-*-android-debug.apk` | Android (debug-signed, sideload) |
            | `*.AppImage` / `*.deb` | Linux desktop |
            | `*.dmg` | macOS desktop |
            | `*.msi` | Windows desktop |

            Verify downloads: `shasum -a 256 -c SHA256SUMS.txt`

            **Early beta** — not a replacement for emergency services. See [KNOWN_LIMITATIONS.md](https://github.com/mycena-project/Mycelium/blob/main/docs/KNOWN_LIMITATIONS.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
