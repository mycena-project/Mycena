# Release on tag: Android APK + Tauri desktop bundles + SHA256SUMS.
# License: AGPL-3.0-or-later — see release notes and LICENSE.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  android:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Reproducible Android APK (pinned container recipe)
        run: ./scripts/reproducible-build.sh --tag "${{ github.ref_name }}"

      - name: Create unsigned release-integrity manifest
        run: |
          cargo run -p mycelium-cli -- release init \
            --tag "${{ github.ref_name }}" \
            --artifact "target/reproducible/mycelium-${{ github.ref_name }}-android.apk" \
            --out "target/reproducible/release-integrity-${{ github.ref_name }}.json"

      - name: Upload reproducible Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-reproducible
          path: |
            target/reproducible/*.apk
            target/reproducible/build-report.json
            target/reproducible/release-integrity-*.json
          retention-days: 7

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-2022
            target: windows
          - os: macos-14
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: release-desktop-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: crates/mycelium-desktop/ui
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/mycelium-desktop
          tauriScript: cargo tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            crates/mycelium-desktop/target/release/bundle/**/*.AppImage
            crates/mycelium-desktop/target/release/bundle/**/*.deb
            crates/mycelium-desktop/target/release/bundle/**/*.dmg
            crates/mycelium-desktop/target/release/bundle/**/*.msi
          if-no-files-found: warn
          retention-days: 7

  sbom:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.85.0

      - name: Generate CycloneDX SBOM
        run: ./scripts/generate-sbom.sh "${{ github.ref_name }}" target/sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            target/sbom/*.cdx.json
            target/sbom/sbom-manifest.json
          retention-days: 90

  publish:
    needs: [android, desktop, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          STAGING="release-assets"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          if [ -f "artifacts/android-reproducible/mycelium-${TAG}-android.apk" ]; then
            cp "artifacts/android-reproducible/mycelium-${TAG}-android.apk" "$STAGING/"
            cp "artifacts/android-reproducible/build-report.json" "$STAGING/" 2>/dev/null || true
            cp "artifacts/android-reproducible/release-integrity-${TAG}.json" "$STAGING/" 2>/dev/null || true
          elif [ -f artifacts/android-apk/app-debug.apk ]; then
            cp artifacts/android-apk/app-debug.apk "$STAGING/mycelium-${TAG}-android-debug.apk"
          fi

          find artifacts -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.msi' \
          \) -exec cp {} "$STAGING/" \;

          if [ -d artifacts/sbom ]; then
            cp artifacts/sbom/*.cdx.json "$STAGING/" 2>/dev/null || true
            cp artifacts/sbom/sbom-manifest.json "$STAGING/" 2>/dev/null || true
          fi

          if [ -z "$(ls -A "$STAGING" 2>/dev/null)" ]; then
            echo "::error::No release artifacts found."
            exit 1
          fi

          ( cd "$STAGING" && shasum -a 256 ./* > SHA256SUMS.txt )
          ls -la "$STAGING"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## License — AGPL-3.0-or-later

            **Mycelium** is free software under the [GNU Affero General Public License v3.0 or later](https://www.gnu.org/licenses/agpl-3.0.html).

            - If you **modify and operate** Mycelium (app, relay, or combined stack) as a **network service**, you must offer **corresponding source** to users interacting with it over the network.
            - To run your **own bootstrap relay**, see [mycelium-relay](https://github.com/mycena-project/mycelium-relay) (same license).

            ### Artifacts

            | File | Platform |
            |------|----------|
            | `mycelium-*-android.apk` | Android (reproducible debug-signed sideload) |
            | `release-integrity-*.json` | BLAKE3 + recipe digest (M-of-N co-sign before **official**) |
            | `build-report.json` | Reproducible build report from CI container |
            | `mycelium-sbom-*.cdx.json` | CycloneDX SBOM (workspace dependencies) |
            | `sbom-manifest.json` | SBOM generator metadata |
            | `*.AppImage` / `*.deb` | Linux desktop |
            | `*.dmg` | macOS desktop |
            | `*.msi` | Windows desktop |

            Verify downloads: `shasum -a 256 -c SHA256SUMS.txt`

            **Release integrity:** compare BLAKE3 and co-signatures per [RELEASE_INTEGRITY.md](https://github.com/mycena-project/Mycelium/blob/main/docs/RELEASE_INTEGRITY.md). The release is **official** only after ≥3 of 5 independent signers attest the same artifact hash.

            **Early beta** — not a replacement for emergency services. See [KNOWN_LIMITATIONS.md](https://github.com/mycena-project/Mycelium/blob/main/docs/KNOWN_LIMITATIONS.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
