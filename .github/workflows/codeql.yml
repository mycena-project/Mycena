name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "22 3 * * 1"

env:
  CI_TIER: ${{ vars.MYCELIUM_CI_TIER || 'budget' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'fuzz/**'
              - '!**/*.md'

  analyze:
    needs: [changes]
    if: |
      always() &&
      !cancelled() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.rust == 'true') &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'schedule' && vars.MYCELIUM_CI_TIER == 'full') ||
        github.event_name == 'pull_request'
      )
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["rust"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: "1.88.0"
          cache-key-suffix: codeql

      - name: Install Linux libraries (Tauri / desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Private repos: SARIF upload to the Code Security tab is not available;
          # keep analysis in CI only (same as the maintainer's other projects).
          upload: never
