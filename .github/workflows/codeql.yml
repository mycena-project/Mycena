name: CodeQL

on:
  schedule:
    - cron: "22 3 * * 1"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_TIER: ${{ vars.MYCELIUM_CI_TIER || 'budget' }}

jobs:
  analyze:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.MYCELIUM_CI_TIER != 'off')
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["rust"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust-cache
        with:
          toolchain: "1.88.0"
          cache-key-suffix: codeql

      - name: Install Linux libraries (Tauri / desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Private repos: SARIF upload to the Code Security tab is not available;
          # keep analysis in CI only (same as the maintainer's other projects).
          upload: never
