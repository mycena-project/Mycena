name: Mycelium CI

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "release/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux libraries (Tauri / desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/mycelium-desktop/ui/package-lock.json
      - name: Build desktop UI
        working-directory: crates/mycelium-desktop/ui
        run: npm ci && npm run build
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: MyceliumLab CI gates
        run: cargo test -p mycelium-sim myceliumlab_ci_gates -- --test-threads=1
