name: Fuzz (PR smoke)

# Security-critical targets only; 90s each. Full target set + long runs: fuzz-nightly.yml
# when MYCELIUM_CI_TIER=full (see docs/CI_PUBLIC_TRANSITION.md).

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: fuzz-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_TIER: ${{ vars.MYCELIUM_CI_TIER || 'budget' }}
  FUZZ_SECONDS: "90"

jobs:
  changes:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fuzz:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'fuzz/**'
              - 'crates/**'
              - '.github/workflows/fuzz-pr.yml'
              - '.github/workflows/fuzz-nightly.yml'

  fuzz:
    needs: changes
    if: |
      github.actor != 'dependabot[bot]' &&
      needs.changes.outputs.fuzz == 'true' &&
      (github.event_name == 'pull_request' || env.CI_TIER == 'budget' || env.CI_TIER == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_envelope
          - fuzz_ble_frame
          - fuzz_coin_payload
          - fuzz_custody_envelope
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo (registry, git, fuzz target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-pr-${{ matrix.target }}-nightly-${{ hashFiles('**/Cargo.lock', 'fuzz/**', 'fuzz/rust-toolchain.toml') }}
          restore-keys: |
            fuzz-pr-${{ matrix.target }}-nightly-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: "Fuzz ${{ matrix.target }} (${{ env.FUZZ_SECONDS }}s)"
        working-directory: fuzz
        run: |
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time=${{ env.FUZZ_SECONDS }} \
            -rss_limit_mb=4096 \
            -timeout=30
