name: Fuzz (PR smoke)

# Security-critical targets. Runs on every PR/push that touches Rust (not gated on CI_TIER).
# Long runs: fuzz-nightly.yml (see docs/CI_PUBLIC_TRANSITION.md).

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: fuzz-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_TIER: ${{ vars.MYCELIUM_CI_TIER || 'budget' }}
  FUZZ_SECONDS: "45"

jobs:
  changes:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fuzz:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'fuzz/**'
              - 'crates/**'
              - '.github/workflows/fuzz-pr.yml'
              - '.github/workflows/fuzz-nightly.yml'

  fuzz:
    needs: changes
    if: |
      github.actor != 'dependabot[bot]' &&
      needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_envelope
          - fuzz_ble_frame
          - fuzz_coin_payload
          - fuzz_custody_envelope
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo (registry, git, fuzz target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-pr-${{ matrix.target }}-nightly-${{ hashFiles('**/Cargo.lock', 'fuzz/**', 'fuzz/rust-toolchain.toml') }}
          restore-keys: |
            fuzz-pr-${{ matrix.target }}-nightly-

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: "Fuzz ${{ matrix.target }} (${{ env.FUZZ_SECONDS }}s)"
        working-directory: fuzz
        run: |
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time=${{ env.FUZZ_SECONDS }} \
            -rss_limit_mb=4096 \
            -timeout=30

  fuzz-gate:
    name: fuzz-gate
    needs: [changes, fuzz]
    if: always() && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require fuzz smoke when Rust changed
        run: |
          set -euo pipefail
          needed="${{ needs.changes.outputs.fuzz }}"
          result="${{ needs.fuzz.result }}"
          if [[ "$needed" != "true" ]]; then
            echo "No Rust/fuzz paths changed; fuzz smoke skipped."
            exit 0
          fi
          [[ "$result" == "success" ]] || { echo "fuzz: $result"; exit 1; }
          echo "fuzz-gate ok"
